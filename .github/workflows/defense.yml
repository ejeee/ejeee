name: Contribution Defense

on:
  schedule:
  - cron: "0 8 * * *" # Jam 08:00 UTC / Jam 15:00 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "state.json"

permissions:
  contents: write

concurrency:
  group: defense
  cancel-in-progress: false

jobs:
  battle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fight tonight's siege
        uses: rim95dev/contribution-defense@v1

      - name: Get current date
        id: date
        run: echo "today=$(date -u +%F)" >> $GITHUB_OUTPUT

      - name: Commit & Push files
        uses: EndBug/add-and-commit@v9
        with:
          message: "battle: defense result ${{ steps.date.outputs.today }} [skip ci]"
          add: "dist state.json"

